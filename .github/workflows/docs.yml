name: Documentation build

on:
  push:
    paths:
      - "docs/**"
      - "src/**"
      - "examples/**"
      - "devguide/**"
      - "pyproject.toml"
      - "devtools/conda-envs/docs_env.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: devtools/conda-envs/docs_env.yaml
          environment-name: docs
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
      - name: Install the documentation candidate
        run: python -m pip install --no-deps --no-build-isolation .
        shell: bash -l {0}
      - name: Verify installed core and dependency closure
        run: |
          python -m pip check
          cd "$RUNNER_TEMP"
          python -I -c 'from importlib.metadata import distribution; from pathlib import Path; import peptidemt; d=distribution("peptidemt"); assert Path(peptidemt.__file__).resolve()==Path(d.locate_file("peptidemt/__init__.py")).resolve(); print(d.version, peptidemt.__file__)'
        shell: bash -l {0}
      - name: Build HTML with strict references
        run: python -m sphinx -b html -n -W --keep-going docs docs/_build/html
        shell: bash -l {0}
      - name: Check executable memory-input documentation
        run: python -m sphinx -b doctest -n -W --keep-going docs docs/_build/doctest
        shell: bash -l {0}
      - name: Retain the documentation preview
        uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
          retention-days: 7
          if-no-files-found: error
